<script>
  let bookData = null;
  let currentPage = 0;

  const urlParams = new URLSearchParams(window.location.search);
  const bookId = urlParams.get('book') || 'book1';

  fetch(`data/${bookId}.json`)
    .then(res => res.json())
    .then(data => {
      bookData = data;
      document.title = `${data.title} - 필로 페어링`;
      document.getElementById('book-title-sub').innerText = data.title;
      
      document.getElementById('essay-tag').innerText = data.essay.tag;
      document.getElementById('essay-title').innerText = data.essay.title;
      document.getElementById('essay-body').innerHTML = data.essay.content;
      
      const refList = document.getElementById('ref-list');
      data.essay.references.forEach(ref => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${ref.url}" target="_blank">${ref.title}</a> - <span style="color:#6b7280; font-size:0.85rem;">${ref.source}</span>`;
        refList.appendChild(li);
      });

      document.getElementById('harvard-body').innerHTML = data.harvard;

      renderPage();
    })
    .catch(err => {
      document.getElementById('app').innerHTML = `<div style="text-align:center; padding:50px;"><h2>책을 불러오지 못했습니다.</h2><p>${err}</p><a href="index.html">서재로 돌아가기</a></div>`;
    });

  function loadBookImage(bookId, pageNum) {
    const imgEl = document.getElementById('story-img');
    const pageNumStr = String(pageNum);
    
    // 시도할 후보 경로들
    const candidates = [
      `images/${bookId}/page${pageNumStr}.jpg`,
      `images/${bookId}/page${pageNumStr}.jpeg`,
      `images/${bookId}/page${pageNumStr}.png`,
      `images/${bookId}/page${pageNumStr}.webp`,
      `images/${bookId}/Page${pageNumStr}.jpg`,
      `images/${bookId}/page${pageNumStr}.JPG`,
      `images/${bookId}/page${pageNumStr}.PNG`,
      `page${pageNumStr}.jpg`,
      `page${pageNumStr}.png`
    ];

    let idx = 0;

    function tryNext() {
      if (idx >= candidates.length) {
        // 모든 경로 실패 시 화면에 디버그 메시지 표시
        imgEl.style.display = 'none';
        let debugBox = document.getElementById('img-debug-box');
        if (!debugBox) {
          debugBox = document.createElement('div');
          debugBox.id = 'img-debug-box';
          debugBox.style.cssText = "position:absolute; bottom:10px; left:10px; right:10px; background:rgba(255,0,0,0.8); color:white; padding:8px; font-size:12px; border-radius:6px; z-index:10; text-align:center;";
          imgEl.parentElement.appendChild(debugBox);
        }
        debugBox.innerHTML = `⚠️ 이미지 로드 실패! 다음 경로들을 모두 찾지 못했습니다:<br><span style="font-family:monospace; font-size:11px;">${candidates[0]} 외 ${candidates.length-1}개</span>`;
        return;
      }

      const debugBox = document.getElementById('img-debug-box');
      if (debugBox) debugBox.remove();

      imgEl.src = candidates[idx];
      idx++;
    }

    imgEl.onload = function() {
      imgEl.style.display = 'block';
      const debugBox = document.getElementById('img-debug-box');
      if (debugBox) debugBox.remove();
    };

    imgEl.onerror = tryNext;
    tryNext();
  }

  function renderPage() {
    if (!bookData) return;
    const p = bookData.pages[currentPage];
    document.getElementById('page-indicator').innerText = `${currentPage + 1} / ${bookData.pages.length}`;
    
    loadBookImage(bookId, currentPage + 1);

    document.getElementById('text-box').innerText = p.text;
    document.getElementById('hint-box').innerText = p.hint;

    document.getElementById('prev-btn').disabled = (currentPage === 0);
    document.getElementById('next-btn').disabled = (currentPage === bookData.pages.length - 1);
  }

  function changePage(step) {
    const next = currentPage + step;
    if (bookData && next >= 0 && next < bookData.pages.length) {
      currentPage = next;
      renderPage();
    }
  }

  function showTab(tabName) {
    document.getElementById('tab-story').style.display = (tabName === 'story') ? 'flex' : 'none';
    ['essay', 'harvard'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('open', tabName === t);
    });
    ['story', 'essay', 'harvard'].forEach(t => {
      document.getElementById('btn-' + t).classList.toggle('active', tabName === t);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>필로 페어링 뷰어</title>
  <style>
    :root { --bg-cream: #f8f5f0; --text-dark: #22252a; --accent-blue: #2563eb; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg-cream); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      display: flex; justify-content: space-between; align-items: center; padding: 14px 24px;
      background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100;
    }
    .back-btn { text-decoration: none; color: #4b5563; font-weight: 600; font-size: 0.9rem; }
    .nav-btns button { padding: 8px 14px; border-radius: 20px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .nav-btns button.active { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }
    
    .viewer-container { max-width: 920px; width: 100%; margin: 24px auto; padding: 0 16px; flex: 1; }
    .story-card { background: #fff; border-radius: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.07); overflow: hidden; display: flex; flex-direction: column; }
    .illustration-box { width: 100%; aspect-ratio: 16/9; background: #cfdef3; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    .illustration-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
    .page-badge { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.65); color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; z-index: 2; }
    
    .story-text-box { padding: 36px 28px; text-align: center; }
    .story-text { font-size: 1.4rem; line-height: 1.65; font-weight: 600; margin-bottom: 18px; white-space: pre-line; }
    .parent-hint { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 12px 20px; border-radius: 12px; font-size: 0.9rem; display: inline-block; max-width: 90%; }
    
    .controls { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #f9fafb; border-top: 1px solid #f3f4f6; }
    .ctrl-btn { padding: 12px 26px; border-radius: 10px; border: none; background: var(--accent-blue); color: #fff; font-weight: 700; cursor: pointer; }
    .ctrl-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    .drawer-section { display: none; background: #fff; border-radius: 20px; padding: 36px 32px; box-shadow: 0 12px 32px rgba(0,0,0,0.07); line-height: 1.8; }
    .drawer-section.open { display: block; }
    .reference-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-top: 24px; }
    .reference-box h4 { margin-bottom: 10px; color: #1e293b; }
    .reference-box ul { padding-left: 20px; }
    .reference-box li { margin-bottom: 6px; }
    .reference-box a { color: #2563eb; text-decoration: none; }
    .reference-box a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">⬅ 서재로 돌아가기</a>
  <div class="nav-btns">
    <button onclick="showTab('story')" id="btn-story" class="active">📖 동화책</button>
    <button onclick="showTab('essay')" id="btn-essay">☕ 부모용 에세이</button>
    <button onclick="showTab('harvard')" id="btn-harvard">🎲 하버드 뇌놀이</button>
  </div>
</header>

<div class="viewer-container" id="app">
  <!-- 동화 뷰어 영역 -->
  <div id="tab-story" class="story-card">
    <div class="illustration-box">
      <span class="page-badge" id="page-indicator">1 / 12</span>
      <img id="story-img" src="" alt="삽화">
    </div>
    <div class="story-text-box">
      <p class="story-text" id="text-box"></p>
      <div class="parent-hint" id="hint-box"></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="prev-btn" onclick="changePage(-1)">◀ 이전</button>
      <span id="book-title-sub" style="font-size:0.9rem; color:#6b7280;">로딩 중...</span>
      <button class="ctrl-btn" id="next-btn" onclick="changePage(1)">다음 ▶</button>
    </div>
  </div>

  <!-- 에세이 탭 -->
  <div id="tab-essay" class="drawer-section">
    <span id="essay-tag" style="background:#dbeafe; color:#1e40af; padding:4px 10px; border-radius:6px; font-size:0.8rem; font-weight:700;"></span>
    <h2 id="essay-title" style="margin-top:12px; margin-bottom:14px;"></h2>
    <div id="essay-body"></div>

    <!-- 큐레이션 링크 박스 (열린연단 & 스탠포드 백과사전 연동) -->
    <div class="reference-box" id="ref-box">
      <h4>📚 더 깊이 읽고 싶다면 (Recommended References)</h4>
      <ul id="ref-list"></ul>
    </div>
  </div>

  <!-- 뇌놀이 탭 -->
  <div id="tab-harvard" class="drawer-section">
    <h2>전두엽을 깨우는 하버드 뇌과학 액티비티</h2>
    <div id="harvard-body"></div>
  </div>
</div>

<script>
  let bookData = null;
  let currentPage = 0;

  // URL 파라미터에서 책 ID 읽기 (예: reader.html?book=book1)
  const urlParams = new URLSearchParams(window.location.search);
  const bookId = urlParams.get('book') || 'book1';

  // JSON 데이터 불러오기
  fetch(`data/${bookId}.json`)
    .then(res => res.json())
    .then(data => {
      bookData = data;
      document.title = `${data.title} - 필로 페어링`;
      document.getElementById('book-title-sub').innerText = data.title;
      
      // 에세이 및 뇌놀이 데이터 렌더링
      document.getElementById('essay-tag').innerText = data.essay.tag;
      document.getElementById('essay-title').innerText = data.essay.title;
      document.getElementById('essay-body').innerHTML = data.essay.content;
      
      // 큐레이션 링크 렌더링
      const refList = document.getElementById('ref-list');
      data.essay.references.forEach(ref => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${ref.url}" target="_blank">${ref.title}</a> - <span style="color:#6b7280; font-size:0.85rem;">${ref.source}</span>`;
        refList.appendChild(li);
      });

      document.getElementById('harvard-body').innerHTML = data.harvard;

      renderPage();
    })
    .catch(err => {
      document.getElementById('app').innerHTML = `<div style="text-align:center; padding:50px;"><h2>책을 불러오지 못했습니다.</h2><p>${err}</p><a href="index.html">서재로 돌아가기</a></div>`;
    });

  function renderPage() {
    if (!bookData) return;
    const p = bookData.pages[currentPage];
    document.getElementById('page-indicator').innerText = `${currentPage + 1} / ${bookData.pages.length}`;
    document.getElementById('story-img').src = `images/${bookId}/page${currentPage + 1}.jpg`;
    document.getElementById('text-box').innerText = p.text;
    document.getElementById('hint-box').innerText = p.hint;

    document.getElementById('prev-btn').disabled = (currentPage === 0);
    document.getElementById('next-btn').disabled = (currentPage === bookData.pages.length - 1);
  }

  function changePage(step) {
    const next = currentPage + step;
    if (bookData && next >= 0 && next < bookData.pages.length) {
      currentPage = next;
      renderPage();
    }
  }

  function showTab(tabName) {
    document.getElementById('tab-story').style.display = (tabName === 'story') ? 'flex' : 'none';
    ['essay', 'harvard'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('open', tabName === t);
    });
    ['story', 'essay', 'harvard'].forEach(t => {
      document.getElementById('btn-' + t).classList.toggle('active', tabName === t);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
